<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Organic Growth OS</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-alt:#f0f3f8;--text:#111827;--muted:#667085;
  --border:#d9e0ea;--accent:#2563eb;--success:#0f9d58;--warning:#d97706;--danger:#dc2626;--info:#0ea5e9;
  --radius-sm:8px;--radius-md:12px;--radius-lg:18px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:32px;--space-8:40px;
  --shadow:0 8px 30px rgba(15,23,42,.08);
}
[data-theme="dark"]{
  --bg:#0d1117;--surface:#161b22;--surface-alt:#1d2430;--text:#eef2f7;--muted:#9aa4b2;
  --border:#2a3441;--accent:#60a5fa;--shadow:0 8px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:18px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800}
.brand h1{font-size:15px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}
.project-switcher{display:flex;gap:8px;margin-bottom:16px}
.project-switcher select{width:100%}
.sidebar details{margin:8px 0}
.sidebar summary{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800;text-transform:uppercase;padding:8px 10px}
.nav-btn{width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:10px 12px;border-radius:10px;margin:2px 0}
.nav-btn:hover,.nav-btn.active{background:var(--surface-alt)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.topbar-left{display:flex;gap:10px;align-items:center;min-width:0}.topbar h2{font-size:18px;margin:0}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 12px;border-radius:10px;font-weight:700}
.btn:hover{filter:brightness(.98)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--danger)}
.content{padding:24px;max-width:1600px;margin:auto}
.grid{display:grid;gap:16px}.grid.kpi{grid-template-columns:repeat(5,minmax(0,1fr))}.grid.two{grid-template-columns:1.3fr .7fr}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:15px}.card h4{margin:0 0 8px}
.kpi-card .label{color:var(--muted);font-size:12px}.kpi-card .value{font-size:28px;font-weight:800;margin-top:6px}.kpi-card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.hero-action{padding:22px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border))}
.hero-action h3{font-size:20px;margin:0 0 8px}.hero-action p{color:var(--muted);margin:0 0 14px;max-width:900px}
.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--border);border-radius:999px;font-size:12px;background:var(--surface-alt)}
.badge.success{color:var(--success)}.badge.warning{color:var(--warning)}.badge.danger{color:var(--danger)}.badge.info{color:var(--info)}
.workflow{display:grid;grid-template-columns:repeat(9,minmax(90px,1fr));gap:8px;overflow:auto;padding-bottom:4px}
.stage{border:1px solid var(--border);background:var(--surface-alt);padding:10px;border-radius:12px;text-align:center;font-size:12px}.stage.current{outline:2px solid var(--accent)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h3{margin:0}.muted{color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:760px;background:var(--surface)}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--surface-alt);font-size:12px;color:var(--muted)}tr:last-child td{border-bottom:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{min-width:160px}
input,select,textarea{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 10px}
textarea{min-height:110px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700}.field.full{grid-column:1/-1}
.empty{padding:36px;text-align:center;color:var(--muted)}
.progress{height:8px;background:var(--surface-alt);border-radius:999px;overflow:hidden}.progress > span{display:block;height:100%;background:var(--accent)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:30;box-shadow:var(--shadow);padding:20px;overflow:auto;transform:translateX(100%);transition:.2s}.drawer.open{transform:none}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:20;display:none}.backdrop.show{display:block}
.drawer-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
.toast-zone{position:fixed;right:18px;bottom:18px;z-index:50;display:grid;gap:8px}.toast{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);padding:12px 14px;border-radius:12px;max-width:360px}
.callout{padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-alt)}
.wizard-step{display:grid;gap:14px}.wizard-big{font-size:24px;font-weight:800}.wizard-actions{display:flex;gap:8px;flex-wrap:wrap}
.metric-row{display:grid;grid-template-columns:180px 1fr 48px;align-items:center;gap:10px;margin:10px 0}.metric-row .bar{height:8px;background:var(--surface-alt);border-radius:999px;overflow:hidden}.metric-row .bar span{display:block;height:100%;background:var(--accent)}
.mobile-menu{display:none}
@media(max-width:1100px){.grid.kpi{grid-template-columns:repeat(2,1fr)}.grid.two{grid-template-columns:1fr}.app{grid-template-columns:240px minmax(0,1fr)}}
@media(max-width:800px){.app{display:block}.sidebar{position:fixed;left:0;top:0;z-index:40;width:280px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile-menu{display:inline-flex}.grid.kpi,.grid.three,.form-grid{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* V4.1 Guided UX + Auto Verification */
.guide-shell{max-width:980px;margin:0 auto}
.guide-progress{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.guide-step{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:var(--surface-alt);font-size:12px;color:var(--muted)}
.guide-step.done{color:var(--success)}.guide-step.active{background:var(--accent);color:#fff;font-weight:800}
.guide-number{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--text) 8%,transparent);font-size:11px;font-weight:800}
.simple-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
.simple-card h3{font-size:24px;margin:0 0 8px}
.simple-card .lead{font-size:15px;color:var(--muted);line-height:1.55}
.explain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.explain-tile{background:var(--surface-alt);border:1px solid var(--border);border-radius:14px;padding:14px}
.explain-tile strong{display:block;margin-bottom:5px}
.help-toggle{border:0;background:transparent;color:var(--accent);padding:0;font-weight:700}
.help-panel{margin-top:10px;padding:12px;border-radius:12px;background:var(--surface-alt);border:1px solid var(--border)}
.next-action-box{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-radius:16px;padding:16px}
.auto-verify{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.auto-verify .dot{width:9px;height:9px;border-radius:50%;background:var(--success)}
.workflow-card{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.workflow-card+.workflow-card{margin-top:10px}
.workflow-card.current{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.workflow-card.done{opacity:.82}
.auto-badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:color-mix(in srgb,var(--success) 12%,var(--surface));color:var(--success);font-size:11px;font-weight:800}
.manual-badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--surface-alt);color:var(--muted);font-size:11px;font-weight:800}
@media(max-width:800px){.explain-grid{grid-template-columns:1fr}.workflow-card{grid-template-columns:1fr}}


/* RC6 UX/UI */
.sidebar{padding:14px}
.brand{padding:6px 4px 12px}
.brand-mark{width:42px;height:42px}
.nav-btn{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 10px}
.nav-btn.active{font-weight:800}
.topbar{min-height:64px}
.topbar-actions input{min-width:220px}
.page-intro{margin-bottom:16px}
.page-intro h3{font-size:22px;margin:0 0 4px}
.page-intro p{margin:0;color:var(--muted)}
.quick-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.compact-card{padding:14px}
.form-grid .field input,.form-grid .field select,.form-grid .field textarea{width:100%}
.form-grid .field textarea{min-height:90px}
.form-actions{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--surface) 25%);padding-top:18px;margin-top:8px}
.table-wrap table tbody tr:hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.table-wrap td{font-size:13px}
.table-wrap th{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.status-dot.ok{background:var(--success)}.status-dot.warn{background:var(--warning)}.status-dot.bad{background:var(--danger)}
.empty{border:1px dashed var(--border);border-radius:14px;background:var(--surface-alt)}
.wizard-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.wizard-nav span{padding:6px 9px;border-radius:999px;background:var(--surface-alt);font-size:11px;color:var(--muted)}
.wizard-nav span.active{background:var(--accent);color:#fff}
.explain-box{border-left:3px solid var(--accent);padding:10px 12px;background:var(--surface-alt);border-radius:8px}
.simple-toggle{display:flex;gap:8px;align-items:center}
.simple-toggle input{width:auto}
.toolbar{align-items:center}
.toolbar .spacer{flex:1}
.section-head{align-items:flex-start}
.card{box-shadow:0 4px 18px rgba(15,23,42,.05)}
[data-theme="dark"] .card{box-shadow:0 4px 18px rgba(0,0,0,.18)}
@media(max-width:700px){
  .topbar-actions input{min-width:0;width:100%}
  .topbar-actions{width:100%}
  .topbar{align-items:flex-start;flex-direction:column}
  .section-head{flex-direction:column}
  .section-head>button,.section-head>div+button{width:100%}
}


.release-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa-item{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface)}
.qa-item strong{display:block;margin-bottom:5px}
.qa-pass{color:var(--success)}.qa-warn{color:var(--warning)}.qa-fail{color:var(--danger)}
.demo-banner{border:1px solid color-mix(in srgb,var(--info) 35%,var(--border));background:color-mix(in srgb,var(--info) 7%,var(--surface));padding:12px;border-radius:12px;margin-bottom:16px}
@media(max-width:800px){.qa-grid{grid-template-columns:1fr}}


.brief-preview{white-space:pre-wrap;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:220px}
.health-list{display:grid;gap:8px}
.health-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.health-item:last-child{border-bottom:0}
.confidence-meter{display:flex;align-items:center;gap:10px}
.confidence-meter .bar{height:8px;flex:1;background:var(--surface-alt);border-radius:999px;overflow:hidden}
.confidence-meter .bar span{display:block;height:100%;background:var(--accent)}
.decision-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--surface);margin-bottom:12px}
.decision-card .why{margin-top:10px;padding:10px;background:var(--surface-alt);border-radius:10px}
.schema-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.schema-box{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-alt)}
.refresh-table{display:grid;gap:10px}
.refresh-item{border:1px solid var(--border);border-radius:12px;padding:12px}
.executive-strip{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
.executive-strip .mini{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.executive-strip .mini strong{font-size:24px;display:block;margin-top:4px}
@media(max-width:1000px){.executive-strip{grid-template-columns:1fr 1fr}.schema-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.executive-strip,.schema-grid{grid-template-columns:1fr}}


.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel-list{display:grid;gap:10px}
.panel-item{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface)}
.panel-item .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.score-ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score)*1%),var(--surface-alt) 0);position:relative}
.score-ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.score-ring strong{position:relative;z-index:1;font-size:22px}
.intent-grid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px;overflow:auto}
.intent-box{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-alt)}
.arch-tree{display:grid;gap:8px}
.arch-node{border-left:3px solid var(--accent);padding:8px 10px;background:var(--surface-alt);border-radius:8px}
.arch-children{margin-left:24px;display:grid;gap:6px}
.diff-row{display:grid;grid-template-columns:160px 1fr 1fr 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border)}
.diff-row:last-child{border-bottom:0}
.warning-box{border:1px solid color-mix(in srgb,var(--warning) 45%,var(--border));background:color-mix(in srgb,var(--warning) 8%,var(--surface));border-radius:12px;padding:12px}
.danger-box{border:1px solid color-mix(in srgb,var(--danger) 45%,var(--border));background:color-mix(in srgb,var(--danger) 8%,var(--surface));border-radius:12px;padding:12px}
.good-box{border:1px solid color-mix(in srgb,var(--success) 45%,var(--border));background:color-mix(in srgb,var(--success) 8%,var(--surface));border-radius:12px;padding:12px}
@media(max-width:900px){.matrix{grid-template-columns:1fr}.diff-row{grid-template-columns:1fr}.intent-grid{grid-template-columns:repeat(5,220px)}}


.graph-shell{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.graph-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.graph-canvas{width:100%;min-height:460px;display:block;background:
radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--border) 60%,transparent) 1px,transparent 0);background-size:22px 22px}
.node-card{position:absolute;min-width:150px;max-width:210px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:var(--shadow);font-size:12px}
.node-card strong{display:block;margin-bottom:4px}
.node-pill{display:inline-flex;padding:3px 6px;border-radius:999px;background:var(--surface-alt);font-size:10px;margin-top:5px}
.split-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:0}
.compare-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.compare-box{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--surface-alt)}
.delta{font-weight:800}
.delta.pos{color:var(--success)}.delta.neg{color:var(--danger)}
.import-preview{max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:12px}
.import-preview table{min-width:900px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow:auto}
.kanban-col{background:var(--surface-alt);border:1px solid var(--border);border-radius:14px;padding:10px;min-height:180px}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0}
.dep-list{display:grid;gap:8px}
.dep-item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:10px}
@media(max-width:900px){.split-panels,.compare-grid{grid-template-columns:1fr}.compare-grid>div:nth-child(2){display:none}.kanban{grid-template-columns:repeat(4,260px)}}

</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigazione principale">
    <div class="brand">
      <div class="brand-mark">OG</div>
      <div><h1>Organic Growth OS</h1><p>Decision Operating System · V4.1</p></div>
    </div>
    <div class="project-switcher">
      <select id="projectSelect" aria-label="Progetto corrente"></select>
      <button class="btn" id="newProjectBtn" title="Nuovo progetto">+</button>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn mobile-menu" id="mobileMenuBtn" aria-label="Apri menu">☰</button>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <div class="muted" id="saveStatus" style="font-size:12px">Non ancora salvato</div>
        </div>
      </div>
      <div class="topbar-actions">
        <input id="globalSearch" placeholder="Cerca…" aria-label="Ricerca globale">
        <button class="btn" id="modeBtn" title="Cambia modalità">Executive</button>
        <button class="btn" id="themeBtn" aria-label="Cambia tema">◐</button>
        <button class="btn primary" id="quickBtn">+ Nuovo</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h3 id="drawerTitle">Dettaglio</h3>
    <button class="btn" id="drawerClose" aria-label="Chiudi">✕</button>
  </div>
  <div id="drawerBody"></div>
</aside>
<div class="toast-zone" id="toastZone" aria-live="polite"></div>

<script>
(() => {
'use strict';

const APP_KEY='organicGrowthOS.v4';
const SCHEMA_VERSION=4;
const stages=['Research','Strategy','Architecture','Build','Validate','Index','Measure','Learn','Expand'];
const navGroups={
  'Overview':['Dashboard','Guided Review','Next Best Actions'],
  'Strategy':['Project','Strategy Canvas','Competitors','Search Intent','Cannibalization'],
  'Authority':['Keywords','Entities','Topical Map','Content Strategy','Content Briefs'],
  'Site':['Pages','Architecture','Internal Links','On-Page','Structured Data'],
  'Technical':['Technical SEO','Redirects','Canonical','Indexation','Migration'],
  'Performance':['Search Console','Opportunities','Content Refresh','Experiments'],
  'Execution':['Issues','Tasks','Milestones','Quality Gates','SEO Debt'],
  'Intelligence':['Evidence','Decisions','Confidence','Observations','Risks','False Positives','Change Log','Snapshots'],
  'Data':['Import','Datasets','Source Reliability','Backup'],

};

class StorageService{
  load(){
    try{
      const raw=localStorage.getItem(APP_KEY);
      if(!raw) return null;
      const data=JSON.parse(raw);
      return this.migrate(data);
    }catch(e){ console.error(e); return null; }
  }
  migrate(data){
    if(!data || typeof data!=='object') throw new Error('Backup non valido');
    if(!data.schemaVersion) data.schemaVersion=1;
    const arrayKeys=['projects','pages','keywords','entities','clusters','contents','links','issues','opportunities','observations','risks','tasks','milestones','decisions','experiments','qualityGates','gscRecords','auditFindings','seoDebt','competitors','evidence','datasets','changeEvents','snapshots','falsePositives','activity'];
    arrayKeys.forEach(k=>{ if(!Array.isArray(data[k])) data[k]=[]; });
    data.ui={activeView:'Dashboard',mode:'Executive',theme:'system',lastSaved:null,...(data.ui||{})};
    if(!Array.isArray(data.sourceReliability) || !data.sourceReliability.length){
      data.sourceReliability=[
        {id:uid('src'),name:'First Party',type:'FIRST PARTY',reliability:95},
        {id:uid('src'),name:'Search Console',type:'SEARCH CONSOLE',reliability:95},
        {id:uid('src'),name:'Crawler',type:'CRAWLER',reliability:85},
        {id:uid('src'),name:'Third Party Tool',type:'THIRD PARTY TOOL',reliability:65},
        {id:uid('src'),name:'Manual',type:'MANUAL',reliability:85},
        {id:uid('src'),name:'Inferred',type:'INFERRED',reliability:40}
      ];
    }
    data.schemaVersion=SCHEMA_VERSION;
    return data;
  }
  save(state){
    try{
      localStorage.setItem(APP_KEY,JSON.stringify(state));
      return true;
    }catch(e){
      toast('Spazio locale insufficiente o salvataggio non riuscito.');
      return false;
    }
  }
  export(state){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`organic-growth-os-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  }
}

function severityWeight(s){ return ({CRITICAL:100,HIGH:75,MEDIUM:45,LOW:20}[s]||25); }
function priorityWeight(s){ return ({P1:100,P2:75,P3:45,P4:20}[s]||25); }

function confidenceFor(item){
  let score=50;
  if(item.sourceReliability!=null) score+=(Number(item.sourceReliability)-50)*.3;
  if(item.evidenceIds?.length) score+=Math.min(25,item.evidenceIds.length*8);
  if(item.verified) score+=15;
  if(item.contradictory) score-=25;
  return clamp(Math.round(score));
}

function scores(){
  const pages=byProject(state.pages), issues=byProject(state.issues), links=byProject(state.links), kws=byProject(state.keywords), audit=byProject(state.auditFindings);
  const technicalFindings=[...issues.filter(i=>String(i.category||'').toLowerCase()==='technical'),...audit];
  const critical=technicalFindings.filter(i=>!['VERIFIED','CLOSED'].includes(String(i.status||'').toUpperCase())&&['CRITICAL','HIGH'].includes(String(i.severity||'').toUpperCase())).length;
  const technical=(pages.length||technicalFindings.length)?clamp(100-critical*9-technicalFindings.filter(i=>!['VERIFIED','CLOSED'].includes(String(i.status||'').toUpperCase())).length*3):null;
  const indexed=pages.length?Math.round(pages.filter(p=>p.indexed===true||String(p.gscStatus||'').toUpperCase()==='INDEXED').length/pages.length*100):null;
  const arch=pages.length?clamp(100-(pages.filter(p=>!p.parent&&p.pageType!=='Homepage').length*3)):null;
  const linkHealth=links.length?clamp(100-links.filter(l=>['BROKEN','REDIRECT','NON_CANONICAL'].includes(String(l.status||'').toUpperCase())).length*6):null;
  const coverage=kws.length?Math.round(kws.filter(k=>k.targetUrl).length/kws.length*100):null;
  const topicalParts=[coverage,arch,linkHealth,indexed].filter(Number.isFinite);
  const topical=topicalParts.length>=2?Math.round(topicalParts.reduce((a,b)=>a+b,0)/topicalParts.length):null;
  const eeat=null;
  const organicParts=[technical,indexed,arch,coverage,topical,linkHealth].filter(Number.isFinite);
  const organic=organicParts.length>=2?Math.round(organicParts.reduce((a,b)=>a+b,0)/organicParts.length):null;
  return {organic,technical,indexed,arch,coverage,topical,linkHealth,eeat};
}

function nextActions(){
  const actions=[];
  const openIssues=byProject(state.issues).filter(i=>!['VERIFIED','CLOSED'].includes(i.status));
  openIssues.forEach(i=>{
    const conf=i.confidence??confidenceFor(i);
    const impact=severityWeight(i.severity);
    const effort=Number(i.effort||2);
    const pri=Math.round((impact*(conf/100)*(i.urgency||1.2)*(i.businessValue||1.1))/Math.max(1,effort));
    actions.push({type:'ISSUE',id:i.id,title:i.title||i.issue||'Issue SEO',why:i.whyNow||'Problema aperto con impatto sul progetto.',impact,effort,confidence:conf,score:pri,priority:i.priority||'P2'});
  });
  byProject(state.opportunities).filter(o=>o.status!=='DONE').forEach(o=>{
    const conf=o.confidence??confidenceFor(o), impact=Number(o.impact||55), effort=Number(o.effort||2);
    actions.push({type:'OPPORTUNITY',id:o.id,title:o.title||o.type,why:o.whyNow||'Opportunità rilevante per la crescita organica.',impact,effort,confidence:conf,score:Math.round(impact*(conf/100)/Math.max(1,effort)),priority:o.priority||'P3'});
  });
  if(!byProject(state.pages).length) actions.push({type:'SETUP',title:'Importa o aggiungi il Page Inventory',why:'Senza inventario pagine il sistema non può valutare architettura, indicizzazione e linking.',impact:90,effort:2,confidence:100,score:45,priority:'P1'});
  else if(!byProject(state.keywords).length) actions.push({type:'SETUP',title:'Aggiungi Keyword Intelligence',why:'Serve per collegare intent, cluster e target URL alle pagine esistenti.',impact:70,effort:2,confidence:95,score:33,priority:'P2'});
  const p1Blockers=actions.filter(a=>a.type==='ISSUE'&&a.priority==='P1');
  if(p1Blockers.length) return p1Blockers.sort((a,b)=>b.score-a.score).slice(0,5);
  return actions.sort((a,b)=>b.score-a.score).slice(0,5);
}

function dependencySatisfied(dep){
  if(!dep) return true;
  const names=String(dep).split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  const completed=[...byProject(state.tasks),...byProject(state.milestones)].filter(x=>['DONE','VERIFIED','COMPLETED','PASSED'].includes(String(x.status||'').toUpperCase())).map(x=>String(x.title||x.name||'').toLowerCase());
  return names.every(n=>completed.some(c=>c.includes(n)||n.includes(c)));
}

function detectOpportunities(){
  const found=[];
  const existingKeys=new Set(byProject(state.opportunities).map(o=>(o.type+'|'+(o.target||o.title||'')).toLowerCase()));
  byProject(state.gscRecords).forEach(r=>{
    const pos=Number(r.position), imp=Number(r.impressions), ctr=parseFloat(String(r.ctr||'').replace('%',''));
    if(pos>=4 && pos<=15 && imp>=100){
      found.push({type:'STRIKING DISTANCE',target:r.page||r.query,title:`Striking distance: ${r.query||r.page}`,impact:70,effort:2,confidence:82,whyNow:`Posizione ${pos.toFixed(1)} con ${imp} impression.`,status:'OPEN'});
    }
    if(imp>=200 && !isNaN(ctr) && ctr<2){
      found.push({type:'HIGH IMPRESSION / LOW CTR',target:r.page||r.query,title:`CTR opportunity: ${r.query||r.page}`,impact:65,effort:1,confidence:78,whyNow:`${imp} impression con CTR ${ctr}%.`,status:'OPEN'});
    }
  });
  const links=byProject(state.links), inbound={}; links.forEach(l=>inbound[l.target]=(inbound[l.target]||0)+1);
  projectPages().filter(p=>p.priority==='P1'||p.pageType==='Pillar').forEach(p=>{
    const u=p.displayUrl||p.normalizedUrl||p.canonicalUrl;
    if((inbound[u]||0)<2) found.push({type:'INTERNAL LINK OPPORTUNITY',target:u,title:`Rafforza internal linking: ${p.pageName||u}`,impact:60,effort:1,confidence:90,whyNow:`Pagina strategica con ${(inbound[u]||0)} inbound link noti.`,status:'OPEN'});
  });
  let added=0;
  found.forEach(o=>{
    const k=(o.type+'|'+(o.target||o.title)).toLowerCase();
    if(!existingKeys.has(k)){state.opportunities.push({id:uid('opp'),projectId:state.currentProjectId,...o,createdAt:now(),updatedAt:now()});existingKeys.add(k);added++;}
  });
  if(added){commit(`Opportunity Engine: ${added} opportunità`);toast(`${added} opportunità generate`);}
  else toast('Nessuna nuova opportunità rilevata con le regole attuali.');
  render();
}

async function handleImportV2(){
  const file=document.getElementById('importFile').files[0], out=document.getElementById('importResult'), target=document.getElementById('importTarget').value;
  if(!file){toast('Seleziona un file');return;}
  try{
    const text=await file.text();
    if(file.name.toLowerCase().endsWith('.json')){
      const data=JSON.parse(text);
      if(data.schemaVersion&&data.projects){pendingImport={kind:'backup',data,file};out.innerHTML=`<div class="callout"><strong>Backup completo rilevato</strong><p class="muted">${data.projects.length} progetti · schema ${data.schemaVersion}</p><button class="btn danger" id="confirmImport">Sostituisci stato corrente</button></div>`;document.getElementById('confirmImport').onclick=commitPendingImport;return;}
      const rows=Array.isArray(data)?data:[data];
      pendingImport={kind:'rows',rows,target,file};
    }else{
      let sep='\t';
      if(!file.name.toLowerCase().endsWith('.tsv')){
        const first=text.split(/\r?\n/)[0]||'';
        const counts={',':(first.match(/,/g)||[]).length,';':(first.match(/;/g)||[]).length,'\t':(first.match(/\t/g)||[]).length};
        sep=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]||',';
      }
      const lines=text.split(/\r?\n/).filter(x=>x.trim());
      if(lines.length<2) throw new Error('Il file non contiene righe dati.');
      const headers=parseDelimited(lines.shift(),sep).map(x=>x.trim());
      const rows=lines.map(line=>{const vals=parseDelimited(line,sep);const o={};headers.forEach((h,i)=>o[h]=vals[i]??'');return o;});
      pendingImport={kind:'rows',rows,target,file,headers};
    }
    const sample=pendingImport.rows.slice(0,8), headers=Object.keys(sample[0]||{});
    const invalid=pendingImport.rows.filter(r=>!Object.keys(r).length).length;
    out.innerHTML=`<div class="callout"><strong>Preview import</strong><p class="muted">${pendingImport.rows.length} record · ${invalid} righe non valide · destinazione ${esc(target)}</p></div>
      <div class="import-preview"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${sample.map(r=>`<tr>${headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div style="margin-top:12px"><button class="btn primary" id="confirmImport">Conferma import</button> <button class="btn" id="cancelImport">Annulla</button></div>`;
    document.getElementById('confirmImport').onclick=commitPendingImport;
    document.getElementById('cancelImport').onclick=()=>{pendingImport=null;out.innerHTML='<div class="muted">Import annullato.</div>';};
  }catch(e){out.innerHTML=`<div class="callout" style="border-color:var(--danger)"><strong>Errore import</strong><p>${esc(e.message)}</p></div>`;}
}

function normalizeImportedRecord(target,row){
  const out={};
  Object.entries(row||{}).forEach(([k,v])=>{
    const key=String(k||'').trim();
    out[key]=typeof v==='string'?v.trim():v;
  });
  const toNum=k=>{ if(out[k]!==undefined&&out[k]!==''&&!Number.isNaN(Number(String(out[k]).replace(',','.')))) out[k]=Number(String(out[k]).replace(',','.')); };
  const toBool=k=>{
    if(out[k]===undefined||out[k]==='') return;
    const v=String(out[k]).toLowerCase();
    if(['true','1','yes','si','sì'].includes(v)) out[k]=true;
    else if(['false','0','no'].includes(v)) out[k]=false;
  };
  if(target==='pages'){ ['statusCode'].forEach(toNum); ['indexable','indexed','sitemap'].forEach(toBool); }
  if(target==='keywords'){ ['volume','difficulty','cpc','position','impressions','clicks','priorityScore'].forEach(toNum); }
  if(target==='gscRecords'){ ['clicks','impressions','position'].forEach(toNum); }
  if(target==='issues'||target==='opportunities'){ ['confidence','impact','effort'].forEach(toNum); }
  return out;
}

function commitPendingImport(){
  if(!pendingImport)return;
  if(pendingImport.kind==='backup'){
    if(!confirm('Sostituire tutti i dati locali con questo backup?'))return;
    state=storage.migrate(pendingImport.data);storage.save(state);pendingImport=null;toast('Backup ripristinato');render();return;
  }
  const {rows,target,file}=pendingImport;
  rows.forEach(x=>state[target].push({id:uid('imp'),projectId:state.currentProjectId,...normalizeImportedRecord(target,x),createdAt:now(),updatedAt:now()}));
  state.datasets.push({id:uid('dataset'),projectId:state.currentProjectId,name:file.name,source:'Import locale',type:target,importedAt:now(),records:rows.length,createdAt:now(),updatedAt:now()});
  commit(`Import confermato: ${file.name}`);runAutomationCycle(false);pendingImport=null;toast(`${rows.length} record importati`);state.ui.activeView=target==='gscRecords'?'Search Console':target==='links'?'Internal Links':({'pages':'Pages','keywords':'Keywords','issues':'Issues','opportunities':'Opportunities'}[target]||'Datasets');render();
}

function architectureView(){
  const pages=projectPages();
  const roots=pages.filter(p=>!p.parent);
  const byName=new Map(pages.map(p=>[p.pageName||p.displayUrl,p]));
  const children={}; pages.forEach(p=>{if(p.parent)(children[p.parent]||(children[p.parent]=[])).push(p);});
  const renderNode=(p,depth=0)=>{
    const name=p.pageName||p.displayUrl||'Page', kids=children[name]||[];
    return `<div class="arch-node"><strong>${esc(name)}</strong><div class="muted">${esc(p.pageType||'Page')} · depth ${depth}</div>${kids.length?`<div class="arch-children">${kids.map(c=>renderNode(c,depth+1)).join('')}</div>`:''}</div>`;
  };
  const missingParents=pages.filter(p=>p.parent&&!byName.has(p.parent));
  const deep=[];
  function walk(p,d){ if(d>3)deep.push(p); (children[p.pageName||p.displayUrl]||[]).forEach(c=>walk(c,d+1)); }
  roots.forEach(r=>walk(r,0));
  return `<div class="section-head"><div><h3>Information Architecture</h3><div class="muted">Relazioni parent/child, profondità e nodi isolati.</div></div><button class="btn" data-nav="Pages">Gestisci pagine</button></div>
  <div class="grid three">${kpi('Pages',pages.length)}${kpi('Missing Parent',missingParents.length)}${kpi('Depth > 3',deep.length)}</div>
  <div style="height:16px"></div>
  <div class="split-panels"><div class="card"><h3>Architecture Tree</h3><div class="arch-tree">${roots.length?roots.map(r=>renderNode(r)).join(''):'<div class="empty">Nessun root node disponibile.</div>'}</div></div>
  <div class="card"><h3>Architecture findings</h3>${missingParents.map(p=>`<div class="warning-box" style="margin-bottom:8px"><strong>Missing parent</strong><div class="muted">${esc(p.pageName||p.displayUrl)} → ${esc(p.parent)}</div></div>`).join('')}${deep.map(p=>`<div class="warning-box" style="margin-bottom:8px"><strong>Excessive depth</strong><div class="muted">${esc(p.pageName||p.displayUrl)}</div></div>`).join('')||'<div class="empty">Nessun finding architetturale rilevato.</div>'}</div></div>`;
}

function canonicalView(){

  pages.forEach(p=>{
    const current=p.canonicalUrl||'', expected=p.expectedCanonical||'';
    if(current&&expected&&current!==expected)findings.push({type:'CANONICAL MISMATCH',page:p,current,expected});
    if(!current)findings.push({type:'MISSING CANONICAL',page:p,current:'—',expected:expected||'Da verificare'});
  });
  links.forEach(l=>{
    if(String(l.status||'').toUpperCase()==='NON_CANONICAL')findings.push({type:'INTERNAL LINK → NON CANONICAL',page:pageByUrl(l.source)||{pageName:l.source},current:l.target,expected:'Canonical target'});
    if(String(l.status||'').toUpperCase()==='REDIRECT')findings.push({type:'INTERNAL LINK → REDIRECT',page:pageByUrl(l.source)||{pageName:l.source},current:l.target,expected:'Final canonical target'});
  });
  return `<div class="section-head"><div><h3>Canonicalization Manager</h3><div class="muted">Current, expected, evidence e recommendation. Nessuna correzione automatica.</div></div><button class="btn" data-nav="Pages">Page Inventory</button></div>

function contentRefreshView(){
  const gsc=byProject(state.gscRecords), pages=projectPages();
  const byPage={};gsc.forEach(r=>{const k=r.page||'';(byPage[k]||(byPage[k]=[])).push(r);});
  const rows=[];
  Object.entries(byPage).forEach(([page,recs])=>{
    if(recs.length<2)return;
    const sorted=[...recs].sort((a,b)=>String(a.dateRange||a.date||'').localeCompare(String(b.dateRange||b.date||'')));
    const first=sorted[0], last=sorted[sorted.length-1];
    const impDelta=Number(last.impressions||0)-Number(first.impressions||0);
    const clickDelta=Number(last.clicks||0)-Number(first.clicks||0);
    const posDelta=Number(last.position||0)-Number(first.position||0);
    let action='KEEP', reason='Performance stabile';
    if(impDelta<0&&clickDelta<0){action='REFRESH';reason='Impressions e click in calo';}
    if(posDelta>3){action='REFRESH';reason='Ranking medio in peggioramento';}
    if(impDelta>0&&clickDelta<=0){action='EXPAND';reason='Domanda cresce ma i click non seguono';}
    rows.push({page,action,reason,impDelta,clickDelta,posDelta});
  });
  return `<div class="section-head"><div><h3>Content Refresh Engine</h3><div class="muted">Analizza storico importato per decay, ranking decline e opportunità di refresh.</div></div><button class="btn" data-nav="Search Console">Dati Search Console</button></div>
  <div class="refresh-table">${rows.length?rows.map(r=>`<div class="refresh-item"><div class="section-head"><div><strong>${esc(r.page||'Page')}</strong><div class="muted">${esc(r.reason)}</div></div><span class="badge ${r.action==='REFRESH'?'warning':r.action==='EXPAND'?'info':'success'}">${r.action}</span></div><div class="badges"><span class="badge">Δ Impr ${r.impDelta>=0?'+':''}${r.impDelta}</span><span class="badge">Δ Clicks ${r.clickDelta>=0?'+':''}${r.clickDelta}</span><span class="badge">Δ Position ${r.posDelta>=0?'+':''}${r.posDelta.toFixed(1)}</span></div></div>`).join(''):`<div class="card empty"><strong>Dati storici insufficienti</strong><p>Servono almeno due periodi Search Console per la stessa pagina.</p></div>`}</div>`;
}

  const score=clamp(Math.round(debts.filter(d=>d.status!=='DONE').reduce((sum,d)=>{
    const sev=severityWeight(String(d.severity||'LOW').toUpperCase());
    const age=Math.min(90,Number(d.age||0));
    const effort=Math.max(1,Number(d.effort||1));
    return sum+(sev*(1+age/180))/effort;
  },0)));
  return `<div class="section-head"><div><h3>SEO Debt</h3><div class="muted">Misura gravità, età e costo del debito accumulato.</div></div><button class="btn primary" data-add="seoDebt">+ Debt Item</button></div>
  <div class="grid two"><div class="card"><div class="section-head"><div><h3>SEO Debt Score</h3><div class="muted">Indicatore interno, non ranking factor.</div></div><div class="score-ring" style="--score:${score}"><strong>${score}</strong></div></div></div>
  <div class="card"><h3>Breakdown</h3>${statusLine('Open debt',debts.filter(d=>d.status!=='DONE').length)}${statusLine('High/Critical',debts.filter(d=>['HIGH','CRITICAL'].includes(String(d.severity||'').toUpperCase())&&d.status!=='DONE').length)}${statusLine('Old > 30d',debts.filter(d=>Number(d.age||0)>30&&d.status!=='DONE').length)}</div></div>
  <div style="height:16px"></div>${genericTableView(configs.seoDebt)}`;
}

function removeControlledDemo(){
  const demoTag='DEMO_RC5', pid=state.currentProjectId;
  if(!confirm('Rimuovere tutti i record demo controllati dal progetto corrente?'))return;
  const arrays=['pages','keywords','links','issues','opportunities','observations','risks','tasks','milestones','decisions','experiments','qualityGates','gscRecords','auditFindings','seoDebt','competitors','evidence','datasets','changeEvents','snapshots','falsePositives','contents','entities','clusters'];
  arrays.forEach(k=>state[k]=state[k].filter(x=>!(x.projectId===pid&&x.demoTag===demoTag)));
  currentProject().isDemo=false;
  commit('Dati demo rimossi');toast('Dati demo rimossi');render();
}

function runReleaseCheck(){
  const pid=state.currentProjectId, p=currentProject();
  const checks=[];
  const add=(name,ok,detail)=>checks.push({name,ok,detail});
  add('Current project',!!p,'Progetto corrente risolvibile');
  add('Unique project IDs',new Set(state.projects.map(x=>x.id)).size===state.projects.length,'ID progetto univoci');
  const collections=['pages','keywords','issues','tasks','decisions','evidence','datasets','links'];
  collections.forEach(k=>{
    const arr=state[k]||[];
    add(`${k}: projectId`,arr.every(x=>!!x.projectId),`${arr.length} record`);
    add(`${k}: unique IDs`,new Set(arr.map(x=>x.id)).size===arr.length,`${arr.length} record`);
  });
  add('Current project isolation',collections.every(k=>(state[k]||[]).filter(x=>x.projectId===pid).every(x=>x.projectId===pid)),'Filtri project-scoped');
  add('Local persistence',typeof localStorage!=='undefined','localStorage disponibile');
  add('Schema version',state.schemaVersion===SCHEMA_VERSION,`schema ${state.schemaVersion}`);
  add('Quality Gate engine',typeof qualityGateEvaluation==='function','Motore disponibile');
  add('Next Best Action engine',typeof nextActions==='function','Motore disponibile');
  add('Opportunity engine',typeof detectOpportunities==='function','Motore disponibile');
  add('Snapshot engine',typeof createSnapshot==='function','Motore disponibile');
  add('No false perfect score',scores().organic!==100 || [state.pages,state.keywords,state.links].some(a=>byProject(a).length>0),'Score non perfetto senza dati');
  add('Active navigation visible',true,'Il gruppo attivo resta aperto');
  add('Import normalization',typeof normalizeImportedRecord==='function','Normalizzazione import disponibile');
  return checks;
}

function deleteCurrentProject(){
  if(state.projects.length<=1){toast('Deve rimanere almeno un progetto.');return;}
  const p=currentProject();
  if(!confirm(`Eliminare il progetto "${p.name}" e tutti i suoi dati locali?`))return;
  const pid=p.id;
  const collections=['pages','keywords','entities','clusters','contents','links','issues','opportunities','observations','risks','tasks','milestones','decisions','experiments','qualityGates','gscRecords','auditFindings','seoDebt','competitors','evidence','datasets','changeEvents','snapshots','falsePositives','activity'];
  collections.forEach(k=>state[k]=(state[k]||[]).filter(x=>x.projectId!==pid));
  state.projects=state.projects.filter(x=>x.id!==pid);
  state.currentProjectId=state.projects[0].id;
  state.ui.activeView='Dashboard';
  storage.save(state);toast('Progetto eliminato');render();
}

function canonicalOpenFindingsCount(){
  let n=0;
  byProject(state.pages).forEach(p=>{
    if(!p.canonicalUrl)n++;
    if(p.expectedCanonical&&p.canonicalUrl&&p.expectedCanonical!==p.canonicalUrl)n++;
  });
  byProject(state.links).forEach(l=>{
    if(['NON_CANONICAL','REDIRECT'].includes(String(l.status||'').toUpperCase()))n++;
  });
  return n;
}

function autoVerifySystemTasks(silent=true){
  let changed=0, verified=0;
  const rules=systemTaskRules();
  byProject(state.tasks).forEach(t=>{
    const rule=rules.find(r=>r.match(t));
    if(!rule)return;
    t.systemGenerated=true;
    t.verificationRule=rule.key;
    const complete=rule.test();
    const isVerified=rule.verified();
    const old=t.status||'TODO';
    if(isVerified && old!=='VERIFIED'){
      t.status='VERIFIED'; t.verifiedAt=now(); t.updatedAt=now(); changed++; verified++;
    } else if(complete && !['DONE','VERIFIED'].includes(old)){
      t.status='DONE'; t.completedAt=now(); t.updatedAt=now(); changed++;
    } else if(!complete && ['DONE','VERIFIED'].includes(old)){
      t.status='TODO'; t.completedAt=''; t.verifiedAt=''; t.updatedAt=now(); changed++;
    }
  });
  if(changed){
    syncWorkflowFromGates(false);
    if(!silent)toast(`${changed} task di sistema aggiornate automaticamente${verified?` · ${verified} verificate`:''}`);
  }
  return changed;
}

function workflowStageRules(){
  const gates=qualityGateEvaluation();
  const gate=name=>gates.find(g=>g.name===name)?.passed===true;
  return [
    {stage:'Research',ready:true,done:()=>Boolean(currentProject()?.domain||byProject(state.pages).length),explain:'Raccogli contesto, sito e dati iniziali.'},
    {stage:'Strategy',ready:()=>true,done:()=>gate('STRATEGY READY'),explain:'Definisci obiettivi, audience e direzione SEO.'},
    {stage:'Architecture',ready:()=>gate('STRATEGY READY'),done:()=>gate('ARCHITECTURE READY'),explain:'Organizza pagine, cluster e relazioni.'},
    {stage:'Build',ready:()=>gate('ARCHITECTURE READY'),done:()=>gate('CONTENT READY'),explain:'Completa contenuti e struttura necessaria.'},
    {stage:'Validate',ready:()=>gate('CONTENT READY'),done:()=>gate('PRE-INDEXATION'),explain:'Controlla problemi tecnici prima dell’indicizzazione.'},
    {stage:'Index',ready:()=>gate('PRE-INDEXATION'),done:()=>gate('INDEXATION READY'),explain:'Verifica che Google possa indicizzare le pagine corrette.'},
    {stage:'Measure',ready:()=>gate('INDEXATION READY'),done:()=>gate('MEASUREMENT READY'),explain:'Importa dati reali Search Console e misura i risultati.'},
    {stage:'Learn',ready:()=>gate('MEASUREMENT READY'),done:()=>byProject(state.snapshots).length>=2||byProject(state.changeEvents).some(c=>c.result),explain:'Confronta prima/dopo e registra ciò che hai imparato.'},
    {stage:'Expand',ready:()=>gate('EXPANSION READY'),done:()=>false,explain:'Espandi solo quando le fondamenta e i dati sono solidi.'}
  ];
}

function suggestedWorkflowStage(){
  const rules=workflowStageRules();
  for(const r of rules){
    if(typeof r.done==='function'&&!r.done()) return r.stage;
  }
  return 'Expand';
}

function syncWorkflowFromGates(notify=false){
  const p=currentProject(); if(!p)return;
  const suggested=suggestedWorkflowStage();
  const currentIndex=stages.indexOf(p.stage);
  const suggestedIndex=stages.indexOf(suggested);
  p.suggestedStage=suggested;
  if(p.workflowMode==='automatic' && suggestedIndex>=0 && suggestedIndex!==currentIndex){
    p.stage=suggested;
    p.updatedAt=now();
    if(notify)toast(`Workflow aggiornato automaticamente: ${suggested}`);
  }
}

function runAutomationCycle(notify=false){
  autoVerifySystemTasks(true);
  syncWorkflowFromGates(notify);
}

function drawerFields(key,rec={}){
 const common={pages:[
   ['pageName','Pagina'],['displayUrl','URL'],['pageType','Tipo'],['statusCode','HTTP'],['canonicalUrl','Canonical'],['expectedCanonical','Expected Canonical'],['primaryKeyword','Primary Keyword'],['intent','Intent'],['cluster','Cluster'],['parent','Parent'],['title','Title'],['meta','Meta'],['h1','H1'],['schema','Schema'],['indexable','Indexable'],['indexed','Indexed'],['sitemap','Sitemap'],['gscStatus','GSC Status'],['priority','Priority']
 ],keywords:[['keyword','Keyword'],['intent','Intent'],['secondaryIntent','Secondary Intent'],['expectedContentType','Expected Content Type'],['userProblem','User Problem'],['desiredOutcome','Desired Outcome'],['targetUrl','Target URL'],['position','Position'],['impressions','Impressions'],['priority','Priority']],
 issues:[['title','Issue'],['category','Category'],['url','URL'],['source','Source'],['severity','Severity'],['priority','Priority'],['status','Status'],['confidence','Confidence'],['whyNow','Why now']],
 opportunities:[['title','Opportunity'],['type','Type'],['impact','Impact'],['effort','Effort'],['confidence','Confidence'],['whyNow','Why now']],
 tasks:[['title','Task'],['priority','Priority'],['status','Status'],['owner','Owner'],['dueDate','Due Date'],['dependencies','Dependencies'],['description','Description']],
 milestones:[['name','Milestone'],['status','Status'],['progress','Progress'],['targetDate','Target Date'],['acceptanceCriteria','Acceptance Criteria']],
 decisions:[['title','Decision'],['status','Status'],['priority','Priority'],['confidence','Confidence'],['recommendation','Recommendation'],['result','Result'],['learning','Learning']],
 evidence:[['claim','Claim'],['observedValue','Observed Value'],['source','Source'],['freshness','Freshness'],['confidence','Confidence'],['notes','Notes']],
 entities:[['name','Entity'],['entityType','Entity Type'],['parent','Parent'],['coverage','Coverage'],['status','Status']],
 experiments:[['hypothesis','Hypothesis'],['status','Status'],['startDate','Start Date'],['result','Result'],['confidence','Confidence']],
 observations:[['title','Observation'],['status','Status'],['confidence','Confidence'],['notes','Notes']],
 risks:[['title','Risk'],['severity','Severity'],['status','Status'],['confidence','Confidence'],['notes','Notes']],
 seoDebt:[['title','SEO Debt'],['severity','Severity'],['age','Age'],['effort','Effort'],['status','Status']],
 qualityGates:[['name','Gate'],['status','Status'],['owner','Owner'],['reason','Reason']],
 falsePositives:[['finding','Finding'],['tool','Tool'],['assessment','Assessment'],['reason','Reason']],
 changeEvents:[['title','Change'],['type','Type'],['date','Date'],['result','Result'],['description','Description']],
 snapshots:[['name','Snapshot'],['reason','Reason']]
 }[key]||[['title','Title'],['status','Status'],['notes','Notes']];
 const textareas=['description','notes','whyNow','recommendation','learning','acceptanceCriteria','reason','userProblem','desiredOutcome'];
 const selectMap={
   priority:['P1','P2','P3','P4'],
   severity:['CRITICAL','HIGH','MEDIUM','LOW'],
   intent:['Informational','Navigational','Commercial Investigation','Transactional','Local'],
   status:['TODO','IN PROGRESS','BLOCKED','DONE','VERIFIED','OPEN','REVIEW','PASSED','NOT READY','PROPOSED','APPROVED','REJECTED','EXECUTED','VALIDATED'],
   pageType:['Homepage','Pillar','Hub','Category','Guide','Article','Recipe','Ingredient','Landing','Product','Service','FAQ','Legal','Other'],
   indexable:['true','false'],
   indexed:['true','false'],
   sitemap:['true','false']
 };
 return common.map(([n,l])=>{
   const full=textareas.includes(n);
   let control='';
   if(selectMap[n]){
     const vals=[...new Set([rec[n],...selectMap[n]].filter(Boolean))];
     control=`<select name="${n}">${vals.map(v=>`<option ${String(rec[n]||'')===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
   } else if(full) control=`<textarea name="${n}" placeholder="Inserisci informazioni utili e verificabili">${esc(rec[n]||'')}</textarea>`;
   else control=`<input name="${n}" value="${esc(rec[n]??'')}" placeholder="${esc(l)}">`;
   return `<div class="field ${full?'full':''}"><label>${l}</label>${control}</div>`;
 }).join('');
}
function openRecordDrawer(key,id=null){
 const rec=id?state[key].find(x=>x.id===id):{};
 openDrawer(id?'Modifica record':'Nuovo record',`<form id="recordForm" class="form-grid">${drawerFields(key,rec)}<div class="field full" style="display:flex;flex-direction:row;gap:8px"><button class="btn primary" type="submit">Salva</button>${id?'<button class="btn danger" type="button" id="deleteRecord">Elimina</button>':''}</div></form>`);
 document.getElementById('recordForm').onsubmit=e=>{
   e.preventDefault(); const data=Object.fromEntries(new FormData(e.target).entries());
   ['confidence','impact','effort','position','impressions','statusCode','progress'].forEach(k=>{if(data[k]!==undefined&&data[k]!=='') data[k]=Number(data[k]);});
   if(key==='pages'){
     ['indexable','indexed','sitemap'].forEach(k=>{ if(data[k]!==undefined) data[k]=String(data[k]).toLowerCase()==='true'; });
   }
   if(id){ Object.assign(rec,data,{updatedAt:now()}); } else state[key].push({id:uid(key.slice(0,-1)||'rec'),projectId:state.currentProjectId,...data,createdAt:now(),updatedAt:now()});
   commit(`${key} aggiornato`); runAutomationCycle(false); closeDrawer(); render(); toast('Salvato');
 };
 const del=document.getElementById('deleteRecord'); if(del) del.onclick=()=>{ if(confirm('Eliminare questo record?')){state[key]=state[key].filter(x=>x.id!==id);commit(`${key} eliminato`);closeDrawer();render();}};
}

function openLinkDrawer(){

  const opts=pages.map(p=>`<option value="${esc(p.displayUrl||p.normalizedUrl||p.canonicalUrl||'')}">${esc(p.pageName||p.displayUrl||'Page')}</option>`).join('');
  openDrawer('Nuovo internal link',`<form id="linkForm" class="form-grid"><div class="field"><label>Source</label><select name="source">${opts}</select></div><div class="field"><label>Target</label><select name="target">${opts}</select></div><div class="field"><label>Anchor</label><input name="anchor"></div><div class="field"><label>Status</label><select name="status"><option>OK</option><option>REDIRECT</option><option>NON_CANONICAL</option><option>BROKEN</option></select></div><div class="field full"><button class="btn primary" type="submit">Salva link</button></div></form>`);
  document.getElementById('linkForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());state.links.push({id:uid('link'),projectId:state.currentProjectId,...data,createdAt:now(),updatedAt:now()});commit('Internal link aggiunto');closeDrawer();render();toast('Link salvato');};
}

async function handleImport(){
 const file=document.getElementById('importFile').files[0]; if(!file){toast('Seleziona un file');return;}
 const text=await file.text(); const out=document.getElementById('importResult'), target=document.getElementById('importTarget').value;
 try{
   if(file.name.toLowerCase().endsWith('.json')){
     const data=JSON.parse(text);
     if(data.schemaVersion && data.projects){
       if(confirm('Questo sembra un backup completo. Sostituire lo stato corrente?')){state=storage.migrate(data);storage.save(state);render();toast('Backup importato');}
       return;
     }
     const arr=Array.isArray(data)?data:[data];
     arr.forEach(x=>state[target].push({id:uid('imp'),projectId:state.currentProjectId,...x,createdAt:now(),updatedAt:now()}));
     commit(`Import JSON ${target}`); out.innerHTML=`<div class="callout">${arr.length} record importati.</div>`; render();
   }else{
     const sep=file.name.endsWith('.tsv')?'\t':',';
     const lines=text.split(/\r?\n/).filter(Boolean); const headers=lines.shift().split(sep).map(x=>x.trim());
     const rows=lines.map(line=>{const vals=parseDelimited(line,sep); const o={}; headers.forEach((h,i)=>o[h]=vals[i]??''); return o;});
     rows.forEach(x=>state[target].push({id:uid('imp'),projectId:state.currentProjectId,...x,createdAt:now(),updatedAt:now()}));
     state.datasets.push({id:uid('dataset'),projectId:state.currentProjectId,name:file.name,source:'Import locale',type:target,importedAt:now(),records:rows.length,createdAt:now(),updatedAt:now()});
     commit(`Import ${file.name}`); out.innerHTML=`<div class="callout">${rows.length} record importati in ${esc(target)}.</div>`; render();
   }
 }catch(e){out.innerHTML=`<div class="callout" style="border-color:var(--danger)">Errore import: ${esc(e.message)}</div>`;}
}
function parseDelimited(line,sep){
 const out=[]; let cur='',q=false;
 for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===sep&&!q){out.push(cur.trim());cur='';}else cur+=c;}out.push(cur.trim());return out;
}

function createSnapshot(){
 const s=scores();
 state.snapshots.push({
   id:uid('snap'),projectId:state.currentProjectId,
   name:`Snapshot ${new Date().toLocaleString('it-IT')}`,reason:'Manuale',
   organicScore:s.organic,technical:s.technical,architecture:s.arch,coverage:s.coverage,indexation:s.indexed,
   internalLinking:s.linkHealth,topical:s.topical,eeat:s.eeat,
   issuesCount:byProject(state.issues).filter(i=>!['VERIFIED','CLOSED'].includes(i.status)).length,
   opportunitiesCount:byProject(state.opportunities).filter(o=>o.status!=='DONE').length,
   pagesCount:byProject(state.pages).length,keywordsCount:byProject(state.keywords).length,
   createdAt:now(),updatedAt:now()
 });
 commit('Snapshot creato'); runAutomationCycle(false); toast('Snapshot creato'); render();
}
function runSystemCheck(){
 const problems=[];
 const ids=new Set(); Object.keys(configs).forEach(k=>{(state[k]||[]).forEach(r=>{if(!r.id)problems.push(`${k}: record senza ID`); else if(ids.has(r.id))problems.push(`ID duplicato: ${r.id}`); else ids.add(r.id); if(!r.projectId)problems.push(`${k}: record senza projectId`);});});
 if(!state.projects.some(p=>p.id===state.currentProjectId)) problems.push('currentProjectId non valido');
 const out=document.getElementById('systemCheckOut');
 out.innerHTML=problems.length?`<div class="callout"><strong>WARNING</strong><ul>${problems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:`<div class="callout"><strong>PASSED</strong><p class="muted">Nessun problema strutturale rilevato nei controlli base.</p></div>`;
}
