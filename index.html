 document.getElementById('saveStatus').textContent=state.ui.lastSaved?'Ultimo salvataggio: '+fmtTime(state.ui.lastSaved):'Non ancora salvato';
 const g=document.getElementById('guidedModeBtn'),a=document.getElementById('advancedModeBtn');
 if(g){g.classList.toggle('active',state.ui.experienceMode==='guided');g.setAttribute('aria-pressed',String(state.ui.experienceMode==='guided'));}
 if(a){a.classList.toggle('active',state.ui.experienceMode==='advanced');a.setAttribute('aria-pressed',String(state.ui.experienceMode==='advanced'));}
 const themeButton=document.getElementById('themeBtn');if(themeButton)themeButton.setAttribute('aria-label',`Tema attuale: ${state.ui.theme}. Cambia tema`);
}
function applyTheme(){
 const theme=state.ui.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.ui.theme;
 document.documentElement.dataset.theme=theme;
}
function openMobile(){
 const sidebar=document.getElementById('sidebar'),backdrop=document.getElementById('backdrop'),button=document.getElementById('mobileMenuBtn');
 sidebar.classList.add('open');button.setAttribute('aria-expanded','true');backdrop.classList.add('show');backdrop.setAttribute('aria-hidden','false');document.body.classList.add('overlay-open');
}
function closeMobile(){
 const sidebar=document.getElementById('sidebar'),backdrop=document.getElementById('backdrop'),button=document.getElementById('mobileMenuBtn');
 sidebar.classList.remove('open');button.setAttribute('aria-expanded','false');
 if(!document.getElementById('drawer').classList.contains('open')){backdrop.classList.remove('show');backdrop.setAttribute('aria-hidden','true');document.body.classList.remove('overlay-open');}
}
function newProject(){
 openDrawer('Nuovo progetto',`<form id="newProjectForm"><div class="field"><label for="newProjectName">Nome progetto</label><input id="newProjectName" name="name" value="Nuovo progetto" required autocomplete="off"></div><div class="field" style="margin-top:12px"><label for="newProjectDomain">Dominio del sito <span class="muted">(facoltativo)</span></label><input id="newProjectDomain" name="domain" type="url" placeholder="https://esempio.it"></div><div style="margin-top:18px"><button class="btn primary" type="submit">Crea progetto</button></div></form>`);
 document.getElementById('newProjectForm').onsubmit=e=>{
   e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());
   const p=emptyProject(String(data.name||'').trim()||'Nuovo progetto');p.domain=normalizeSiteDomain(data.domain)||'';
   state.projects.push(p);state.currentProjectId=p.id;state.ui.activeView='Project';commit('Nuovo progetto creato');closeDrawer();render();toast('Progetto creato');
 };
}
function quickActions(){
 openDrawer('Quick Actions',`<div class="grid">
 <button class="btn" data-quick="pages">+ Pagina</button><button class="btn" data-quick="keywords">+ Keyword</button><button class="btn" data-quick="issues">+ Problema</button><button class="btn" data-quick="tasks">+ Task</button><button class="btn" data-quick="milestones">+ Milestone</button><button class="btn" data-quick="snap">Crea snapshot</button>
 </div>`);
 document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const k=b.dataset.quick;if(k==='snap'){createSnapshot();closeDrawer();}else openRecordDrawer(k);});
}

document.getElementById('projectSelect').onchange=e=>{state.currentProjectId=e.target.value;commit('Progetto cambiato');render();};
document.getElementById('newProjectBtn').onclick=newProject;
document.getElementById('drawerClose').onclick=closeDrawer;
document.getElementById('backdrop').onclick=()=>{if(document.getElementById('drawer').classList.contains('open'))closeDrawer();else closeMobile();};
document.getElementById('mobileMenuBtn').onclick=openMobile;
document.getElementById('quickBtn').onclick=quickActions;
document.getElementById('modeBtn').onclick=()=>{state.ui.mode=state.ui.mode==='Executive'?'Consultant':'Executive';commit('Modalità cambiata');setupTopbar();render();};
document.getElementById('themeBtn').onclick=()=>{state.ui.theme=state.ui.theme==='dark'?'light':'dark';commit('Tema cambiato');applyTheme();};
document.getElementById('globalSearch').oninput=e=>{
 const q=e.target.value.trim().toLowerCase();
 if(q.length<2){if(document.getElementById('drawer').dataset.kind==='search')closeDrawer();return;}
 const groups=[['Pages',byProject(state.pages),'pageName'],['Keywords',byProject(state.keywords),'keyword'],['Issues',byProject(state.issues),'title'],['Tasks',byProject(state.tasks),'title'],['Decisions',byProject(state.decisions),'title']];
 const hits=[]; groups.forEach(([type,arr,key])=>arr.forEach(r=>{if(JSON.stringify(r).toLowerCase().includes(q))hits.push({type,label:r[key]||r.title||r.name||r.id});}));
 openDrawer('Risultati della ricerca',hits.length?hits.slice(0,30).map(h=>`<button type="button" class="nav-btn" data-search-nav="${h.type}"><strong>${esc(h.label)}</strong><div class="muted">${esc(navLabel(h.type))}</div></button>`).join(''):`<div class="empty"><strong>Nessun risultato</strong><p>Prova con un termine diverso o più breve.</p></div>`,'search');
 document.querySelectorAll('[data-search-nav]').forEach(b=>b.onclick=()=>{state.ui.activeView=b.dataset.searchNav;closeDrawer();render();});
};

window.addEventListener('error',e=>{console.error('OGOS runtime error',e.error||e.message);});
window.addEventListener('unhandledrejection',e=>{console.error('OGOS promise error',e.reason);toast('Si è verificato un errore inatteso. I dati già salvati restano disponibili.');});
window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);state.ui.lastSaved=now();storage.save(state);});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
   if(document.getElementById('drawer').classList.contains('open'))closeDrawer();
   else if(document.getElementById('sidebar').classList.contains('open'))closeMobile();
 }
 if(e.key==='Tab'&&document.getElementById('drawer').classList.contains('open')){
   const focusable=[...document.getElementById('drawer').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
   if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
 }
});
runAutomationCycle(false);
setupTopbar(); render();
})();
</script>
</body>
</html>
